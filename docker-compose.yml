# Static site — same pattern as elevated-tanzania-safaris: host network + fixed port.
# Nginx Proxy Manager forwards to http://209.74.72.96:8080 (not container name).
# PocketBase runs from pocketbase/docker-compose.yml (separate stack, port 9112).

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: mambeu-web:latest
    container_name: mambeu-web
    restart: unless-stopped
    network_mode: host
