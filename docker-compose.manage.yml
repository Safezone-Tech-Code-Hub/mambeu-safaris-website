# Vue staff dashboard — same pattern as elevated-tanzania-safaris:
# network_mode: host, process binds 0.0.0.0 itself. No Docker network is created
# (this VPS has no free address pools for a new bridge).
# NPM: http://209.74.72.96:8082
services:
  manage:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        VITE_POCKETBASE_URL: ${VITE_POCKETBASE_URL:-https://dashboard-mambeu.schoolhub.space}
        VITE_PUBLIC_SITE_URL: ${VITE_PUBLIC_SITE_URL:-https://new-mambeu.schoolhub.space}
    image: mambeu-manage:latest
    container_name: mambeu-manage
    restart: unless-stopped
    network_mode: host
