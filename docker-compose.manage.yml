# Vue staff dashboard — published port 8081 → manage-mambeu.schoolhub.space in NPM.
# Bridge + ports (not host network): host-mode nginx was binding only 127.0.0.1:8081 → NPM 502.
services:
  manage:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        VITE_POCKETBASE_URL: ${VITE_POCKETBASE_URL:-https://dashboard-mambeu.schoolhub.space}
        VITE_PUBLIC_SITE_URL: ${VITE_PUBLIC_SITE_URL:-https://new-mambeu.schoolhub.space}
    image: mambeu-manage:latest
    container_name: mambeu-manage
    restart: unless-stopped
    ports:
      - "8081:80"
