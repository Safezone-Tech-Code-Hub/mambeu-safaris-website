server {
    listen 0.0.0.0:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location = /404.html {
        internal;
    }

    error_page 404 /404.html;

    location / {
        # Existing pages use their prerendered index.html.
        # New safaris and places fall through to the app so they work before the next rebuild.
        try_files $uri $uri/ $uri/index.html /index.html;
    }
}
