# PocketBase for Mambeu — same pattern as elevated-tanzania-safaris-pb.
# You can run from this folder in the repo, or copy to e.g.
# ~/sandbox/mambeu-pocketbase on server1 (keep pb_data with the compose file).
#
# Nginx Proxy Manager: http://209.74.72.96:9112 → dashboard-mambeu.schoolhub.space

services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: mambeu-pocketbase
    restart: unless-stopped
    network_mode: host
    environment:
      PB_HOST: 0.0.0.0
      PB_PORT: "9112"
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL:-}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD:-}
      TZ: Africa/Dar_es_Salaam
    volumes:
      - ./pb_data:/pb_data
