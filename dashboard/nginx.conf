server {
    # Same idea as Elevated's `next start --hostname 0.0.0.0 --port 3233`.
    # Host network + an explicit address so NPM can reach the public IP.
    # 8081 is already taken on this VPS (127.0.0.1:8081).
    listen 0.0.0.0:8082;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
