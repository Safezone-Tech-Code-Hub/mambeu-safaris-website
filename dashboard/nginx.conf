server {
    # Same idea as Elevated's `next start --hostname 0.0.0.0 --port 3233`.
    # Host network + an explicit address so NPM can reach the public IP.
    # 8081 is already taken on this VPS (127.0.0.1:8081).
    listen 0.0.0.0:8082;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    # On some hosts (full disk, overlay2) sendfile can stall large JS transfers; read in userspace instead.
    sendfile off;
    tcp_nopush off;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json;

    # Vite puts hashed bundles here — explicit location matches public site nginx and avoids try_files oddities.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
